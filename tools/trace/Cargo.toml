[package]
name = "rc-trace"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Dev tool (never ships): the class census over the level overlays, and EE memory from PCSX2 (savestates or PINE). Doc: tools/trace/README.md."

# Pure-Rust decoders only, pinned to the versions/features Bevy already pulls in (Cargo.lock),
# so adding this crate neither adds lock entries nor changes a feature set of the engine's graph.
[dependencies]
rc-formats = { path = "../../crates/rc-formats" }
# The port's game crate (pure Rust, no Bevy), for the class census (the class registry, the spawn rules).
rc-game = { path = "../../crates/rc-game" }
anyhow.workspace = true
ruzstd = "0.8"
miniz_oxide = "0.8"
