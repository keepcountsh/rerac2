[package]
name = "rc-extract"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "rerac2-extract: identifies the user's Ratchet & Clank: Going Commando disc image and copies its files into the data folder (docs/plan/launcher_contract.md)."

# Dependency-free by decision (docs/plan/decisions.md): only the workspace's own format readers.
[dependencies]
rc-formats = { path = "../rc-formats" }

[lib]
name = "rc_extract"
path = "src/lib.rs"

[[bin]]
name = "rerac2-extract"
path = "src/main.rs"
